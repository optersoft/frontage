[project]
name = "frontage"
dynamic = ["version"]
description = "Python frontend framework for PyScript: reactive components and an SPA router, with no JavaScript toolchain"
readme = "README.md"
# Apache-2.0 is inherited from PuePy, the project this is forked from; see NOTICE.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
# 3.9 is the floor upstream chose. The package also has to run under MicroPython
# in the browser, which is the real constraint on what syntax the code may use.
requires-python = ">=3.9"
keywords = ["pyscript", "pyodide", "micropython", "webassembly", "frontend", "framework", "reactive", "spa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Environment :: WebAssembly",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = []

[project.urls]
Homepage = "https://frontage.optersoft.com"
Documentation = "https://academy.optersoft.com/tool/frontage"
Repository = "https://github.com/optersoft/frontage"
Issues = "https://github.com/optersoft/frontage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "frontage/version.py"

[tool.hatch.build.targets.wheel]
packages = ["frontage"]

[tool.hatch.build.targets.sdist]
include = ["frontage", "tests", "examples", "docs", "mkdocs.yml", "serve_examples.py", "README.md", "LICENSE", "NOTICE", "ACKNOWLEDGEMENTS.md"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-playwright>=0.5",
    "ruff>=0.16",
    # Pre-1.0 and fast-moving: pin, and expect new diagnostics on an upgrade.
    "ty>=0.0.78,<0.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6",
    "mkdocs-material-extensions>=1.3",
    "mkdocstrings[python]>=0.28",
    "mkdocs-macros-plugin>=1.3",
    "mike>=2.1",
    "beautifulsoup4>=4.13",
]

[tool.ruff]
line-length = 120
# Match the oldest interpreter the package claims, so ruff never suggests syntax it lacks.
target-version = "py39"
extend-exclude = ["docs-legacy-files"]

[tool.ruff.lint]
# No "UP": the package runs under MicroPython too, and pyupgrade rewrites are
# exactly the kind of change that is fine on CPython and breaks there.
select = ["E", "F", "I", "B"]
# The formatter owns line width; what it cannot wrap (docstrings, long strings) is not worth a lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Examples are teaching material read in the browser; star-style brevity is the point.
"examples/**" = ["B"]

[tool.ty.src]
include = ["frontage", "tests"]

[tool.ty.environment]
# What CI runs; the package itself claims 3.9 and MicroPython, which no checker models.
python-version = "3.12"
# Stubs for the browser-only modules (js, pyodide.ffi, pyscript.*), see typings/README.md.
extra-paths = ["typings"]

[tool.pytest.ini_options]
# The unit tests run anywhere. The integration suite under tests/integration
# drives the examples in a real browser (Playwright) and is run explicitly:
# `mk test --integration`.
testpaths = ["tests/unittests"]
