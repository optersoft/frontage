[project]
name = "frontage-components-workspace"
version = "0"
description = "Not published: the workspace that lints and tests the component packages."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.16",
    "frontage",
    "frontage-layout",
    "frontage-chart",
    "frontage-table",
    "frontage-map",
    "frontage-supabase",
    "frontage-polars[server]",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[tool.uv.sources]
# The host framework and both packages come from the checkouts beside this one, the way every
# Rust crate in this fleet resolves its siblings (optersoft/CLAUDE.md, the path-dep banner).
frontage = { path = "../frontage", editable = true }
frontage-layout = { path = "frontage-layout", editable = true }
frontage-chart = { path = "frontage-chart", editable = true }
frontage-table = { path = "frontage-table", editable = true }
frontage-polars = { path = "frontage-polars", editable = true }
frontage-map = { path = "frontage-map", editable = true }
frontage-supabase = { path = "frontage-supabase", editable = true }

[tool.ruff]
line-length = 120
# The components run under MicroPython in the browser, so the same subset rule as frontage.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
# The unit tests run anywhere and need no browser. `tests/browser` drives a built example in
# Chromium and is run explicitly, the same split frontage makes for the same reason: importing
# `playwright.sync_api` leaves a running event loop on the main thread, and every test in this
# repository that drives async code does so with `asyncio.run`, which then refuses with
# "cannot be called from a running event loop". Collecting both in one session fails thirteen
# tests that pass in either half alone.
#
#     uv run pytest                          the unit tests
#     uv run pytest tests/browser            the browser tests
testpaths = ["tests"]
addopts = "--ignore=tests/browser"
