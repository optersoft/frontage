[project]
name = "frontage"
dynamic = ["version"]
description = "Fine-grained reactive UI framework for Python in the browser, on MicroPython compiled to WebAssembly"
readme = "README.md"
# Section 3 grants patents both ways, section 5 makes contributions arrive under the same
# terms with no CLA, section 6 reserves the trademark. Not the MIT OR Apache pair on purpose.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
# CPython is only the test and tooling host. The real constraint on the package's syntax
# is MicroPython in the browser (no typing at runtime, no dataclasses); see CLAUDE.md.
requires-python = ">=3.12"
keywords = ["micropython", "webassembly", "wasm", "frontend", "framework", "reactive", "spa", "pyscript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Environment :: WebAssembly",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = []

[project.scripts]
frontage = "frontage.cli:script"

[project.urls]
Homepage = "https://academy.optersoft.com/python/frontage"
Documentation = "https://academy.optersoft.com/python/frontage"
Repository = "https://github.com/optersoft/frontage"
Issues = "https://github.com/optersoft/frontage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "frontage/version.py"

[tool.hatch.build.targets.wheel]
packages = ["frontage"]

[tool.hatch.build.targets.sdist]
include = ["frontage", "tests", "examples", "editors", "tools/serve.py", "tools/fetch_pyscript.py", "tools/lsp_probe.py", "README.md", "DESIGN.md", "SPEC.md", "LICENSE", "NOTICE"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-playwright>=0.5",
    "ruff>=0.16",
    # Pre-1.0 and fast-moving: pin, and expect new diagnostics on an upgrade.
    "ty>=0.0.78,<0.1",
    # Cross-compiles the framework to bytecode for the browser image. Maintainers only: the
    # wheel ships the built image, so nothing a user installs needs this. Pinned to the mpy
    # ABI of the interpreter in frontage/_runtime (MicroPython 1.28 is MPY_VERSION 6).
    "mpy-cross-v6.3>=1.1.1",
]

[tool.ruff]
line-length = 120
# The package must parse on MicroPython, so ruff (and its formatter, which rewrites syntax
# per target: PEP 758 unparenthesized excepts on 3.14) targets 3.12 for it; only the files
# that use template strings are 3.14.
target-version = "py312"
# tools/micropython/variant/manifest.py is read by MicroPython's build, where `include` is a builtin.
extend-exclude = ["tools/pyscript", "www", "typings", "tools/micropython/variant"]

[tool.ruff.per-file-target-version]
"tests/test_m2.py" = "py314"
"examples/template/template.py" = "py314"

[tool.ruff.lint]
# No "UP": the package runs under MicroPython too, and pyupgrade rewrites are
# exactly the kind of change that is fine on CPython and breaks there.
select = ["E", "F", "I", "B"]
# The formatter owns line width; what it cannot wrap (docstrings, long strings) is not worth a lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Examples are teaching material read in the browser; brevity over lint.
"examples/**" = ["B", "E402"]

[tool.ty.src]
include = ["frontage", "tests"]

[tool.ty.environment]
# What CI runs; the package itself claims 3.9 and MicroPython, which no checker models.
python-version = "3.14"
# Stubs for the browser-only modules (js, pyodide.ffi, pyscript.*), see typings/README.md.
extra-paths = ["typings"]

[tool.pytest.ini_options]
# The unit tests run anywhere and need no browser. tests/browser drives the examples in
# Chromium under both interpreters and is run explicitly: `mk test --browser`.
testpaths = ["tests"]
addopts = "--ignore=tests/browser"
