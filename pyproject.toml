[project]
name = "frontage-components-workspace"
version = "0"
description = "Not published: the workspace that lints and tests the component packages."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.16",
    "frontage",
    "frontage-layout",
    "frontage-chart",
    "frontage-table",
]

[tool.uv.sources]
# The host framework and both packages come from the checkouts beside this one, the way every
# Rust crate in this fleet resolves its siblings (optersoft/CLAUDE.md, the path-dep banner).
frontage = { path = "../frontage", editable = true }
frontage-layout = { path = "frontage-layout", editable = true }
frontage-chart = { path = "frontage-chart", editable = true }
frontage-table = { path = "frontage-table", editable = true }

[tool.ruff]
line-length = 120
# The components run under MicroPython in the browser, so the same subset rule as frontage.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
