# Test on every push; build and publish to PyPI on a version tag.
#
# Publishing uses PyPI trusted publishing (OIDC): no token is stored anywhere.
# It needs a publisher registered at
# https://pypi.org/manage/account/publishing/ with:
#
#   provider    GitHub
#   owner       optersoft
#   repository  frontage
#   workflow    ci.yml
#   env         pypi   (must match the `environment:` below)
#
# ⚠ **TWO of them, one per project: `frontage` and `frontage-api`.** Everything else in the
# record is identical, and a missing second one is silent until the tag: `git push` works,
# the wheel builds, and only the upload answers `422 invalid-publisher`. Nothing is burned
# when it does — the version is never taken, so re-running the job publishes it once the
# record exists.
#
# Release: bump frontage/version.py, commit, then
# `git tag -a v0.1.0 -m … && git push origin v0.1.0`.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "17 4 * * *"  # nightly: the browser suite on Firefox and WebKit too
  workflow_dispatch:

env:
  UV_VERSION: "0.10.7"
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check
      # The runtime's compiler, for `frontage build`; and the runtime's own tests against
      # CPython (rust/py/tests), which the venv above provides.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --profile native -p fpy
        working-directory: rust
      - run: cargo test --profile native
        working-directory: rust
      - run: uv run --frozen pytest -q

  # The examples in a real browser on the runtime. Slower, so separate.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --profile native -p fpy
        working-directory: rust
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --frozen
      # `--with-deps` runs `apt-get update`, which fails if *any* configured repository has a
      # bad index — and the runner image ships Google's Chrome repository, which served a
      # "Hash Sum mismatch" for hours on 2026-09-09 and took the browser job down with it.
      # We install Playwright's own Chromium and have never needed that repository, so it
      # goes: by content, not by file name, because the image writes it as `.list` or as
      # deb822 `.sources` depending on its age.
      - name: Drop apt sources we do not use (Google Chrome)
        run: |
          sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
      # And if apt is broken anyway, install the browser without the system libraries rather
      # than fail here: the runner image already carries most of them, and a Chromium that
      # cannot start fails the tests below, which is the honest place to find out.
      - run: uv run --frozen playwright install --with-deps chromium || uv run --frozen playwright install chromium
      - run: uv run --frozen pytest -q tests/browser --browser chromium
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/

  # Firefox and WebKit, nightly and on demand: the same suite, the other two engines.
  browsers-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --frozen
      - name: Drop apt sources we do not use (see the browser job)
        run: sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
      - run: >
          uv run --frozen playwright install --with-deps ${{ matrix.browser }}
          || uv run --frozen playwright install ${{ matrix.browser }}
      - run: uv run --frozen pytest -q tests/browser --browser ${{ matrix.browser }}

  # The compiler, one binary per platform, attached to the release: `frontage build` fetches
  # the one for its machine on first use (cli/frontage_rt.py), so the wheel stays pure Python.
  compiler:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          # The Intel macOS binary is cross-compiled from the arm64 runner: GitHub's macos-13
          # image is on its way out and a queued job there blocks the publish behind it.
          - { os: macos-14, asset: fpy-macos-arm64 }
          - { os: macos-14, asset: fpy-macos-x64, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, asset: fpy-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: fpy-linux-arm64 }
          - { os: windows-latest, asset: fpy-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - run: cargo build --profile native -p fpy ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: rust
      - run: cp rust/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}native/fpy${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.asset }}
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # The server, one binary per platform, attached to the release (`API.md` §6.5). Until it
  # existed, every deploy of a consumer compiled this repository's working tree inside a
  # Docker build; now a Dockerfile downloads the one for its target and ships it.
  #
  # No Windows: the consumers are fleet VMs and this laptop, and a platform nobody runs is a
  # platform nobody notices breaking.
  server:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: macos-14, asset: frontage-api-macos-arm64 }
          - { os: macos-14, asset: frontage-api-macos-x64, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, asset: frontage-api-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: frontage-api-linux-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      # `--profile api` and not `native`: the gate's OAuth flow needs `panic = "unwind"`,
      # which is what that profile exists for.
      - run: cargo build --profile api -p frontage-api ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: rust
      - run: cp rust/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}api/frontage-api ${{ matrix.asset }}
        shell: bash
      # A binary that cannot start is worse than no binary: it passes every check a
      # release does and fails on the VM. `--help` is the cheapest thing that loads it.
      - run: ./${{ matrix.asset }} --help
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  publish:
    needs: [test, browser, compiler, server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Lets the job mint the OIDC token PyPI exchanges for a one-off upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      # Catch a wheel that is missing files before it reaches PyPI.
      - run: uv run --isolated --no-project --with dist/*.whl -- python -c "import frontage; print(frontage.__version__)"
      # The browser runtime rides in the wheel. `import frontage` passes without it, so a
      # packaging mistake would ship a release that installs fine and boots nothing.
      - run: |
          uv run --isolated --no-project --with dist/*.whl -- python -c "
          from frontage.cli import frontage_rt
          for name in frontage_rt.ASSETS:
              path = frontage_rt.RUNTIME_DIR / name
              assert path.is_file(), f'{name} missing from the wheel'
              print(f'{name}: {path.stat().st_size:,} bytes')
          assert (frontage_rt.RUNTIME_DIR / 'frontage.wasm').stat().st_size > 400_000
          "
      - run: uv run --isolated --no-project --with dist/*.tar.gz -- python -c "import frontage; print(frontage.__version__)"
      # The server's wheel (`API.md` §7 decided two). It is built from `packaging/api`, which
      # holds no source of its own — the package lives beside `frontage/` where the tests
      # import it from — so this is a wheel and not an sdist; `packaging/api/pyproject.toml`
      # says why. Built into a directory of its own, because `uv publish` takes a whole one.
      - run: uv build --wheel --out-dir ../../api-dist
        working-directory: packaging/api
      # Same check as above, and the one that matters more here: the server's package is
      # pure Python and useless without the binary, so this proves at least that it imports.
      - run: uv run --isolated --no-project --with api-dist/*.whl -- python -c "import frontage_api; print(frontage_api.App)"
      # The wheel is half a release: the other half is the asset the `server` job just
      # uploaded, and `frontage-api` is the script that goes and gets it. Run it against the
      # binary built right here rather than downloading, because the release this tag makes
      # is not published until this job finishes.
      - run: cargo build --profile api -p frontage-api
        working-directory: rust
      - run: |
          FRONTAGE_API_BIN="$PWD/rust/target/api/frontage-api" \
            uv run --isolated --no-project --with api-dist/*.whl -- frontage-api --help
      - run: uv publish --trusted-publishing always
      # ⚠ A SECOND trusted publisher, registered on PyPI for the project `frontage-api` with
      # this same owner/repo/workflow/environment. The failure is silent in the usual way: a
      # `422 invalid-publisher` on the upload, with the version never taken and the job
      # re-runnable once the record exists.
      - run: uv publish --trusted-publishing always api-dist/*
