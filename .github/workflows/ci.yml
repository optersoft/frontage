# Tests every component against the frontage checked out beside this one, and publishes the
# four packages to PyPI on a tag.
#
# Publishing uses trusted publishing (OIDC): no token is stored anywhere. It needs **one**
# publisher per package registered at https://pypi.org/manage/account/publishing/, one per package:
#
#   provider    GitHub
#   owner       optersoft
#   repository  frontage-component
#   workflow    ci.yml
#   env         frontage-layout | frontage-chart | frontage-table | frontage-map  <- one each, see below
#
# ⚠ **The environment must differ per package, and that is not decoration.** A *pending*
# publisher is unique on `(owner, repo, workflow, environment)`, so registrations that
# share an environment collide: the second is refused with "A pending trusted publisher
# matching this configuration has already been registered for a different project name."
# That is the monorepo case, pypi/warehouse#16920. Naming each environment after its package
# makes the tuples distinct, and the job below picks the right one from the tag.
#
# If PyPI ever refuses even so, the other differentiator in that tuple is the workflow file:
# split this into publish-<package>.yml, one per package.
#
# PyPI matches the OIDC claim against the repository's *current* owner, and a mismatch fails
# with `422 invalid-publisher` — the version is never uploaded, so it stays claimable and
# re-running the job succeeds once the publisher exists.
#
# Release: bump the version in the package's own pyproject.toml, then tag
# `<package>-vX.Y.Z` — `frontage-chart-v0.1.0` publishes only frontage-chart.
#
# Tests every component against the frontage checked out beside this one — the same path-dep
# convention the fleet's Rust repos follow (optersoft/CLAUDE.md). CI has no sibling checkout,
# so it clones frontage first; `[tool.uv.sources]` then resolves to it.
name: ci

on:
  push:
    branches: [main]
    tags: ["*-v*.*.*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: frontage-component
      - uses: actions/checkout@v5
        with:
          repository: optersoft/frontage
          path: frontage
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: frontage-component/uv.lock
      - run: uv sync --all-groups
        working-directory: frontage-component
      - run: uv run ruff check .
        working-directory: frontage-component
      - run: uv run ruff format --check .
        working-directory: frontage-component
      - run: uv run pytest -q
        working-directory: frontage-component
      # The rule that a component can break while installing and importing perfectly: its
      # Python must be written in the subset MicroPython runs in the browser.
      - run: uv run --project ../frontage python -m frontage check frontage-layout frontage-chart frontage-table frontage-map tests
        working-directory: frontage-component

  target:
    # Which package does this tag release? Its own job because `publish` needs the answer to
    # choose its `environment:`, and a job's environment can read `needs` but not its own steps.
    # A tag names the package: `frontage-chart-v0.1.0`. One repo, four packages, four
    # cadences — a shared version would force a pointless release of the others.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.which.outputs.package }}
    steps:
      - uses: actions/checkout@v5
      - id: which
        run: |
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          version="${tag##*-v}"
          test -d "$package" || { echo "::error::no directory $package for tag $tag"; exit 1; }
          declared=$(grep -m1 '^version = ' "$package/pyproject.toml" | cut -d\" -f2)
          test "$declared" = "$version" || {
            echo "::error::$package/pyproject.toml says $declared, tag says $version"; exit 1; }
          echo "package=$package" >> "$GITHUB_OUTPUT"

  publish:
    needs: [test, target]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Named after the package, because that is what makes this package's PyPI publisher
    # distinct from the others. See the note at the top of this file.
    environment: ${{ needs.target.outputs.package }}
    permissions:
      # Lets the job mint the OIDC token PyPI exchanges for a one-off upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv build
        working-directory: ${{ needs.target.outputs.package }}
      # A component whose browser assets went missing installs and imports perfectly and then
      # does nothing in a page, so check they are in the wheel before it reaches PyPI.
      #
      # The wheel is read as a zip, not installed and imported: a component's Python imports
      # `frontage`, which is not in an isolated environment, so importing it to look at its
      # own files fails for a reason that has nothing to do with what is being checked.
      - name: The wheel carries its browser half
        working-directory: ${{ needs.target.outputs.package }}
        run: |
          python3 - <<'CHECK'
          import glob, zipfile
          package = "${{ needs.target.outputs.package }}".replace("-", "_")
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          entry = f"{package}/_browser/index.js"
          assert entry in names, f"{entry} is not in {wheel}"
          shipped = sorted(n for n in names if n.startswith(f"{package}/_browser/"))
          print(wheel, "ships", shipped)
          CHECK
      - run: uv publish --trusted-publishing always
        working-directory: ${{ needs.target.outputs.package }}
