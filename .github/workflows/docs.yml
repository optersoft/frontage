# Documentation to GitHub Pages via mike (versioned mkdocs).
#
# Every push to main publishes the `development` alias; every published release
# publishes its version and moves `stable` to it. GitHub Pages must be set to
# serve the gh-pages branch once, by hand, in the repository settings.

name: Docs

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  UV_VERSION: "0.10.7"
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --frozen
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - if: github.event_name == 'push'
        run: uv run --frozen mike deploy --push --update-aliases development
      - if: github.event_name == 'release'
        run: |
          VERSION=$(uv run --frozen python -c "import frontage; print(frontage.__version__)")
          uv run --frozen mike deploy --push --update-aliases "$VERSION" stable
          uv run --frozen mike set-default --push stable
