# The HTTP server: FastAPI's shape on axum, with the handlers on this repository's own Python
# runtime. `API.md` is the design and the measurements; `../Cargo.toml` says why this crate is
# a workspace member but not a default one.
[package]
name = "frontage-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FastAPI's shape on axum, with the handlers on frontage's Python runtime"

[[bin]]
name = "frontage-api"
path = "src/main.rs"

[dependencies]
# ⚠ `axum` follows the fleet pin: `hive-server` is "0.8" and `axum-oauth` is "=0.8.9",
# because that is what dioxus 0.7 re-exports. A split minor breaks type unification at
# compile time, not at link time. `API.md` §4.8.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
# A streamed body is an mpsc receiver turned into a Stream; nothing else needs this.
tokio-stream = "0.1"
# Static files are served by Rust, not by walking a directory through an interpreter:
# ranges, etags and sendfile come with it. Same major as `hive-server`'s.
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
frontage-vm = { path = "../vm" }
frontage-compile = { path = "../compile" }


# The sign-in gate (`API.md` §5a). Default on, because the binary that ships is the one a
# private site is deployed behind; `--no-default-features` builds the server without it and
# without reqwest, jsonwebtoken and their graph.
# ⚠ `default-features = false` matters: reqwest's features are additive across a whole
# dependency graph, so enabling its defaults here would drag native-tls (and OpenSSL) in.
# Unlike `axum-oauth`, which borrows a TLS backend from its consumer's graph, this binary is
# the whole graph — so it names rustls itself, or the token exchange has no way to speak TLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
jsonwebtoken = { version = "9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
urlencoding = { version = "2", optional = true }

[features]
default = ["auth", "http"]
# `_http`, the native module a handler reaches the network through (`API.md` §6.4). It shares
# the gate's reqwest rather than bringing a second client: one connection pool per worker
# thread, one TLS backend in the graph.
http = ["dep:reqwest"]
auth = ["dep:reqwest", "dep:jsonwebtoken", "dep:serde", "dep:serde_json", "dep:base64", "dep:sha2", "dep:getrandom", "dep:urlencoding"]
