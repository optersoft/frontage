# The HTTP server: FastAPI's shape on axum, with the handlers on this repository's own Python
# runtime. `API.md` is the design and the measurements; `../Cargo.toml` says why this crate is
# a workspace member but not a default one.
[package]
name = "frontage-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FastAPI's shape on axum, with the handlers on frontage's Python runtime"

[[bin]]
name = "frontage-api"
path = "src/main.rs"

[dependencies]
# ⚠ `axum` follows the fleet pin: `hive-server` is "0.8" and `axum-oauth` is "=0.8.9",
# because that is what dioxus 0.7 re-exports. A split minor breaks type unification at
# compile time, not at link time. `API.md` §4.8.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
frontage-vm = { path = "../vm" }
frontage-compile = { path = "../compile" }
