[package]
name = "frontage-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the runtime as a WebAssembly module for the browser: exports over a C ABI, a host of JavaScript imports"

[lib]
crate-type = ["cdylib"]

[dependencies]
frontage-vm = { path = "../vm" }
frontage-compile = { path = "../compile", optional = true }

[features]
# The compiler in the page: `exec`/`compile` and `run_source`, for the playground and the
# runner. Off for a built app, which runs bytecode the host compiled.
compiler = ["dep:frontage-compile"]

[build-dependencies]
frontage-vm = { path = "../vm" }
frontage-compile = { path = "../compile" }
