[project]
name = "frontage-table"
version = "0.2.0"
description = "A virtualised, sortable data grid for frontage — pure Python, no JavaScript"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
requires-python = ">=3.12"
keywords = ["frontage", "webassembly", "micropython", "components", "table", "grid", "dataframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Environment :: WebAssembly",
    "Programming Language :: Python :: Implementation :: MicroPython",
]
# No runtime dependency, deliberately. `frontage` is the host, not a dependency: this package's
# Python is packed into the app by `frontage build` and imported inside the browser, where pip
# is not involved. Declaring it would only mislead a resolver.
dependencies = []

# How `frontage build` finds this package. Build-time metadata read on CPython; the browser
# pays nothing for the mechanism.
[project.entry-points."frontage.components"]
table = "frontage_table"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontage_table"]
