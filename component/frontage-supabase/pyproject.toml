[project]
name = "frontage-supabase"
version = "0.1.0"
description = "Supabase and PostgREST for frontage: queries as resources, RLS-aware errors, and realtime as a signal"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Optersoft, S.L.", email = "david@optersoft.com" }]
requires-python = ">=3.12"
keywords = ["frontage", "webassembly", "micropython", "components", "supabase", "postgrest", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Environment :: WebAssembly",
    "Programming Language :: Python :: Implementation :: MicroPython",
]
# No runtime dependency, and nothing vendored either — unlike every other component here, this
# one has no third-party code at all. Supabase's data API is PostgREST, which is HTTP and JSON,
# and Realtime is a websocket; the browser has both. supabase-js would have been 0.64 MB to do
# what `fetch` already does.
dependencies = []

[project.entry-points."frontage.components"]
supabase = "frontage_supabase"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontage_supabase"]
