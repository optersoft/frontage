<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign up — a schema over a form, and over JSON</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 1.5rem; max-width: 1000px; color: #222; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
    .lede { color: #666; margin: 0 0 1.25rem; }
    .halves { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .fr-field { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .25rem; font-size: .85rem; color: #555; }
    .fr-input, .fr-textarea, select { font: inherit; padding: .35rem .5rem; }
    .fr-textarea { width: 100%; min-height: 9rem; box-sizing: border-box; font-family: ui-monospace, monospace; }
    .fr-button { font: inherit; padding: .4rem .9rem; margin-top: .75rem; }
    .fr-button:disabled { opacity: .5; }
    .fr-error { margin-bottom: .6rem; }
    pre { background: #f6f6f6; padding: .6rem; border-radius: 6px; overflow: auto; }
    ul { padding-left: 1.2rem; color: #b3261e; }
  </style>
</head>
<body>
<div id="app">Loading…</div>
<script type="module" src="./_frontage/boot.js" data-fr-boot data-fr-entry="app"></script>
</body>
</html>
