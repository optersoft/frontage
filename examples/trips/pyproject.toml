# The example as a deployable: a project `uv sync --frozen` materialises on a fleet VM
# (`runtime = "uv"` in hive's fleet.toml), whose `trips` script starts uvicorn on `TRIPS_ADDR`.
# The page it serves is `www/`, written by `frontage build` before the artifact ships.
[project]
name = "trips"
version = "0.1.0"
description = "The frontage-polars example, deployable: FastAPI + polars behind uvicorn"
requires-python = ">=3.12"
dependencies = ["frontage-polars[server]==0.2.0"]

[project.scripts]
trips = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]
