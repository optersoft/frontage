<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Frontage hello</title>
  <link rel="stylesheet" href="/pyscript/core.css">
  <script type="module" src="/pyscript/core.js" offline></script>
</head>
<body>
<pre id="app">Loading…</pre>
<script>
  // ?type=mpy or ?type=py picks the interpreter, so one page serves both smoke tests.
  const type = new URLSearchParams(location.search).get("type") || "mpy";
  const s = document.createElement("script");
  s.type = type;
  s.src = "./hello.py";
  s.setAttribute("config", "../pyscript.json");
  document.body.appendChild(s);
</script>
</body>
</html>
